name: Deploy GitHub Pages

on:
  push:
    branches: [main, bible-world-v2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Validate and build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_TERRAIN_PMTILES_URL: ${{ vars.VITE_TERRAIN_PMTILES_URL }}
          VITE_TERRAIN_JERUSALEM_PMTILES_URL: ${{ vars.VITE_TERRAIN_JERUSALEM_PMTILES_URL }}
          VITE_TERRAIN_GALILEE_PMTILES_URL: ${{ vars.VITE_TERRAIN_GALILEE_PMTILES_URL }}
          VITE_TERRAIN_MEGIDDO_PMTILES_URL: ${{ vars.VITE_TERRAIN_MEGIDDO_PMTILES_URL }}
          VITE_TERRAIN_SINAI_PMTILES_URL: ${{ vars.VITE_TERRAIN_SINAI_PMTILES_URL }}
          VITE_TERRAIN_DELTA_PMTILES_URL: ${{ vars.VITE_TERRAIN_DELTA_PMTILES_URL }}
          VITE_BASEMAP_PMTILES_URL: ${{ vars.VITE_BASEMAP_PMTILES_URL }}
          VITE_BASEMAP_ATTRIBUTION: ${{ vars.VITE_BASEMAP_ATTRIBUTION }}
          VITE_ROMAN_ROADS_GEOJSON_URL: ${{ vars.VITE_ROMAN_ROADS_GEOJSON_URL }}
          VITE_ROMAN_ROADS_SOURCE_ID: ${{ vars.VITE_ROMAN_ROADS_SOURCE_ID }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
