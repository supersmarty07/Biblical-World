<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1014" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="The Biblical World" />
    <meta name="description" content="The Biblical World — an evidence-aware interactive historical atlas from Genesis to Revelation." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/atlas-mark.svg" type="image/svg+xml" />
    <title>The Biblical World</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-fallback" class="boot-fallback" hidden>
      <div>
        <strong>The Biblical World did not start.</strong>
        <span>The page was published, but the application bundle did not initialize. Reload once; if this persists, check the GitHub Pages Vite deployment artifact.</span>
        <button type="button" onclick="window.location.reload()">Reload</button>
      </div>
    </div>
    <script>
      window.setTimeout(function () {
        if (document.documentElement.dataset.appBooted === 'true') return;
        var fallback = document.getElementById('boot-fallback');
        if (fallback) fallback.hidden = false;
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
